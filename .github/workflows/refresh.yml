name: Refresh Buy Signal Aggregator

on:
  schedule:
    # 22:17 UTC Mon-Fri: after the US close in both EST and EDT (09:17 Melbourne the next morning in summer)
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-download every price series from scratch (slower, about 10-15 minutes)"
        type: boolean
        default: false

permissions:
  contents: write      # monthly keepalive commit
  pages: write
  id-token: write

concurrency:
  group: buy-signal-aggregator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Rebuild dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          mkdir -p site
          ARGS="--out site/index.html --cache cache --ism data/ism_overrides.csv"
          if [ "$FULL_REFRESH" = "true" ]; then ARGS="$ARGS --refresh"; fi
          # one retry after a pause: Yahoo occasionally rate-limits shared runner IPs
          python rebuild.py $ARGS || { echo "::warning::first attempt failed, retrying in 3 minutes"; sleep 180; python rebuild.py $ARGS; }

      - name: Save price cache
        if: always() && hashFiles('cache/prices.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: cache
          key: prices-${{ github.run_id }}

      - name: Sanity check
        run: python check.py site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Monthly keepalive commit
        # GitHub disables scheduled workflows after 60 days without repository activity
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" -le "07" ] && [ "$(date -u +%u)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
